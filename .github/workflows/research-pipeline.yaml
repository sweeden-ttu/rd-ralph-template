name: Research Pipeline

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
          - questions
          - experiment
          - embeddings
          - agent
          - results
          - full
        description: Phase to run
        required: true
        default: full
      question:
        type: choice
        options:
          - all
          - q1
          - q2
          - q3
        description: Question to process
        required: false
        default: all

env:
  DEFAULT_CHAT_MODEL: gpt-4o
  DEFAULT_EMBEDDING_MODEL: text-embedding-3-small

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install rd-agent-mcp

      - name: Run Phase
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ inputs.phase }}" == "full" ]; then
            echo "Running full research pipeline"
          else
            echo "Running phase: ${{ inputs.phase }}"
          fi

      - name: Commit Results
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --quiet || git commit -m "Phase ${{ inputs.phase }} results"
          git push || echo "No changes to commit"
