name: Agent Demo

on:
  workflow_dispatch:
    inputs:
      question:
        type: choice
        options:
          - q1
          - q2
          - q3
        description: Question to demo
        required: true
        default: q1

env:
  CHAT_MODEL: gpt-4o
  EMBEDDING_MODEL: text-embedding-3-small

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install rd-agent-mcp

      - name: Run Demo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Running demo for ${{ inputs.question }}"
